<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#faf9f6"/><script>try{const p=localStorage.getItem('orbit.theme');const t=p==='light'||p==='dark'?p:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#111623':'#faf9f6'}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script><title>Orbit — Your job search, in motion</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
